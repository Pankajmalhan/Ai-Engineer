[project]
name = "document-ingestion-dedup"
version = "0.1.0"
description = "Week 1c project: unified multi-format ingestion (Unstructured.io), MinHash LSH near-dedup (datasketch), content-hash incremental upsert into pgvector, and Presidio-based PII redaction, with dedup/PII rates logged to W&B."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "unstructured[docx,pdf,md,pptx]>=0.15",  # PDF (digital + OCR)/HTML/DOCX/MD -> unified elements
    "datasketch>=1.6",                        # MinHash + MinHashLSH for near-duplicate detection
    "presidio-analyzer>=2.2",                 # NER-backed PII detection (built on spaCy)
    "presidio-anonymizer>=2.2",               # redaction/anonymization of detected PII
    "spacy>=3.7",
    "psycopg[binary]>=3.1",                   # Postgres driver
    "pgvector>=0.3",                          # vector type + distance operators for psycopg
    "sentence-transformers>=3.0",             # real dense embeddings for the pgvector column
    "wandb>=0.17",                            # dedup-rate / PII-hit-rate metrics logging
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "python-docx>=1.1",   # generates a real .docx test fixture
    "reportlab>=4.2",     # generates a real digital-text .pdf test fixture
]

[tool.pytest.ini_options]
testpaths = ["tests"]
