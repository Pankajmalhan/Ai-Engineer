[project]
name = "hybrid-search-rrf"
version = "0.1.0"
description = "Week 1 project: pgvector + pg_search BM25 hybrid retrieval, fused with RRF"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "fastembed>=0.4.2",
    "llama-index-core>=0.12.0",
    "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
