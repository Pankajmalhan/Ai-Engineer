[project]
name = "ollama-vps-edge"
version = "0.1.0"
description = "Week 11 project: the Northwind API RAG service with a swappable LLM backend -- OpenAI, or a self-hosted Ollama model on a VPS behind Nginx (basic auth + HTTPS) -- plus an eval harness that compares the two."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "openai>=1.50",
    "httpx>=0.27",
    "rank-bm25>=0.2",
    "ragas>=0.4",
    "datasets>=3.0",
    "python-dotenv>=1.0",
    # Pinned <0.4 for the same reason as Weeks 5-9: ragas imports
    # langchain_community.chat_models.vertexai at module load, removed in 0.4.x.
    "langchain-community<0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
