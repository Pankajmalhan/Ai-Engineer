# Nginx in front of Ollama. Installed to /etc/nginx/conf.d/ollama.conf by
# scripts/setup_vps.sh, which substitutes __SERVER_NAME__. Ollama itself listens only on
# 127.0.0.1:11434 -- Nginx is the only thing reachable from the internet.
#
# This file is HTTP-only on purpose: `certbot --nginx` (run by setup_vps.sh after this is
# in place) rewrites this server block to add the 443 listener, the certificate paths,
# and an 80->443 redirect. Writing the TLS block by hand before a certificate exists
# would make `nginx -t` fail.

# Cheap abuse brake: __RATE__ req/s per client IP plus a burst allowance (both substituted at
# install time; defaults 5 and 10). CPU inference is slow so a real client never comes close,
# but a GPU answers in ~0.5 s and a load test easily exceeds 5 req/s -- raise it for
# benchmarking (Terraform: nginx_rate_limit_per_second / nginx_rate_limit_burst). Excess
# requests get 503.
limit_req_zone $binary_remote_addr zone=ollama_rl:10m rate=__RATE__r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Unauthenticated liveness probe for uptime monitors; reveals nothing about Ollama.
    location = /healthz {
        auth_basic off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        auth_basic           "Ollama";
        auth_basic_user_file /etc/nginx/.ollama_htpasswd;

        limit_req zone=ollama_rl burst=__BURST__ nodelay;

        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        # Ollama is happiest when it sees a loopback Host; forwarding the public name
        # can trip its host/origin checks.
        proxy_set_header Host 127.0.0.1:11434;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # Streaming responses (stream:true) arrive token by token. With buffering on,
        # Nginx would hold them until the buffer fills and the client would see the
        # whole answer arrive in one lump.
        proxy_buffering off;
        proxy_cache off;

        # CPU inference on a small VPS: model load + prompt eval + generation can
        # legitimately take minutes. The 60s Nginx default would 504 a good request.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Prompts carry retrieved context; the 1 MB default is fine, but say it.
        client_max_body_size 2m;
    }
}
