[project]
name = "braintrust-release-gating"
version = "0.1.0"
description = "Week 8 project: the Northwind API RAG service (same fixture as Weeks 5-7), instrumented with Langfuse tracing and gated by a Braintrust eval-as-CI release check."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "openai>=1.50",
    "rank-bm25>=0.2",
    "langfuse>=3.0",
    "braintrust>=0.0.170",
    "ragas>=0.2",
    "datasets>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
