[project]
name = "chunking-embedding-selection"
version = "0.1.0"
description = "Week 1b: chunking strategy + embedding model selection for a code+text corpus"
requires-python = ">=3.11"
dependencies = [
    "chonkie[st,code,semantic]>=1.4.0",
    "sentence-transformers>=3.3.0",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "einops>=0.8.0",
    "tabulate>=0.9.0",
    "tqdm>=4.67.0",
    "requests>=2.32.0",
    "wandb>=0.18.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
