[project]
name = "cross-encoder-reranking"
version = "0.1.0"
description = "Week 2 project: Cohere Rerank (managed) vs. BGE Reranker (self-hosted) as a Stage 2 cross-encoder on top of Week 1's hybrid pipeline"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "fastembed>=0.4.2",
    "llama-index-core>=0.12.0",
    "tabulate>=0.9.0",
    "python-dotenv>=1.0",
    "cohere>=5.13",
    "sentence-transformers>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
