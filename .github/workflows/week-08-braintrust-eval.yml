name: Week 8 - Braintrust Release Gate

# Runs the Braintrust eval (evals/eval_rag_quality.py) on every PR touching this
# project, via braintrustdata/eval-action -- per Braintrust's own "Run in CI" docs,
# this action supports Node, Python, and Go runtimes and automatically posts the
# resulting score comparison against the base branch's experiment as a PR comment.
# That comment IS the "release gate" signal for a human reviewer; nothing in this repo
# computes or posts the diff by hand.
on:
  pull_request:
    branches: [main, env/prod]
    paths:
      - "weeks/week-08-braintrust-release-gating/project/**"
      - ".github/workflows/week-08-braintrust-eval.yml"

permissions:
  pull-requests: write
  contents: read

jobs:
  braintrust-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weeks/week-08-braintrust-release-gating/project
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: weeks/week-08-braintrust-release-gating/project
          enable-cache: true

      # `root` scopes the action to this subdirectory (it defaults to the repo root,
      # which is why the CLI couldn't find evals/ before); `package_manager: uv` tells
      # the action to install deps itself via uv, in that root, so the `braintrust`
      # CLI it shells out to is actually on its PATH.
      - name: Run Braintrust eval
        uses: braintrustdata/eval-action@v2
        with:
          api_key: ${{ secrets.BRAINTRUST_API_KEY }}
          runtime: python
          root: weeks/week-08-braintrust-release-gating/project
          package_manager: uv
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
